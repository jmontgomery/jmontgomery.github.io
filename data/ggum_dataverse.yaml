# GGUM-for-Congress Dataverse mapping — single source of truth for
# download URLs on /data/ggum-congress/ and its 37 chamber sub-pages.
#
# BEFORE the Dataverse deposit: leave `dataset_doi` and all `files.*` values
# empty.  The generator scripts fall back to /uploads/ggum-congress/<file>.
#
# AFTER the Dataverse deposit: fill in `dataset_doi`, `dataset_url`, and
# each file's `url` from the Harvard Dataverse "file access URL".  Re-run:
#
#   cd ~/GitHub/jmontgomery.github.io
#   Rscript /path/to/make-chamber-pages.R
#   Rscript /path/to/compose.R
#   hugo
#
# Every download button, inline link, and citation block will swap in one
# shot, and a "Permanent archive" badge appears on the master page.

dataset_doi: ""           # e.g. "10.7910/DVN/ABCDEF"
dataset_url: ""           # e.g. "https://doi.org/10.7910/DVN/ABCDEF"
dataset_version: ""       # e.g. "V1" — included in the citation when set

# Harvard Dataverse file-access URL for each release artifact.  The template
# is:  https://dataverse.harvard.edu/api/access/datafile/:persistentId/?persistentId=doi:10.7910/DVN/XXX/YYY
