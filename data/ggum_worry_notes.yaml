    note: "Ron Paul is commonly viewed as the House's defining libertarian-conservative pole for three decades.  GGUM places him near the chamber median in this Congress only; every adjacent term places him among the twenty most conservative House members."

S100:
  - icpsr: 7638    # PROXMIRE, William (D-WI)
    note: "Proxmire's public profile combined socially liberal positions (civil rights, Genocide Convention advocacy) with a pronounced fiscal hawkishness that produced the Golden Fleece Award and routine opposition to federal spending.  GGUM places him near the chamber median despite his having the single most liberal DW-NOMINATE score in this Congress; this may partly reflect the cross-pressured voting record that a one-dimensional scaling smooths over."

S104:
  - icpsr: 15039   # McCAIN, John Sidney, III (R-AZ)
    note: "McCain's public reputation as a maverick and cross-party dealmaker (McCain-Feingold campaign-finance reform) is largely about procedural style rather than ideological moderation.  GGUM places him among the twenty most conservative senators in this Congress, which may be consistent with his underlying voting record even if it conflicts with the maverick framing."

S111:
