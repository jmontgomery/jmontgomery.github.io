# Chamber-specific caveats surfaced on the sub-page when a member's GGUM
# placement conflicts with external records.  Rendered as a "Noted concerns"
# section under the off-diagonal table on /data/ggum-congress/<tag>/.
# The regen pipeline also sets `ggum_flag = "review"` in the CSV row for
# each member listed here.

H102:
  - icpsr: 15059   # SIKORSKI, Gerald Edward (D-MN)
    note: "GGUM places Sikorski to the left of Bernie Sanders in this chamber, which conflicts with his historical record as a mainstream suburban Minnesota liberal rather than an ultra-left figure.  A five-chain seeded-init refit reproduces the placement, so the result is a stable feature of the roll-call matrix rather than a sampling artifact."

H104:
  - icpsr: 11036   # MYERS, John Thomas (R-IN)
    note: "GGUM places Myers near the extreme-right pole despite a modest DW-NOMINATE score (+0.24).  Part of a chamber-wide 'systematic reversal' pattern in H104 in which moderate Republicans are placed as extreme and hardline conservatives are compressed toward the center."
  - icpsr: 29546   # JONES, Walter Beaman, Jr. (R-NC)
    note: "Jones is placed at the far-right pole, which anticipates his later anti-war maverick turn beginning in 2003 but is extreme relative to his H104 roll-call behavior.  Part of the systematic reversal pattern above."
  - icpsr: 14657   # SENSENBRENNER, Frank James, Jr. (R-WI)
    note: "GGUM places Sensenbrenner near the center despite a clearly conservative DW-NOMINATE score (+0.64).  Part of the chamber-wide reversal pattern in H104."
  - icpsr: 15455   # DUNCAN, John J., Jr. (R-TN)
    note: "Compressed toward the center despite a conservative DW-NOMINATE score (+0.60).  Same reversal pattern."
  - icpsr: 29565   # SANFORD, Mark (R-SC)
    note: "Compressed toward the center despite a strongly conservative DW-NOMINATE score (+0.69).  Same reversal pattern."

H107:
  - icpsr: 29126   # RAMSTAD, James (Jim) (R-MN)
    note: "GGUM places Ramstad near the extreme-right pole, which conflicts with his widely documented record as a pro-choice, Mainstream Coalition Republican.  A reproducibility check across chains confirms the placement is a structural feature of the H107 roll-call matrix rather than a sampling issue --- likely driven by post-9/11 unity votes on which libertarian-right Republicans dissented from a near-unanimous conservative mainstream."
  - icpsr: 29539   # LoBIONDO, Frank A. (R-NJ)
    note: "Placed near the extreme-right pole despite a Blue Collar / Tuesday Group reputation.  Part of the H107 pattern described above."
  - icpsr: 29563   # ENGLISH, Philip Sheridan (R-PA)
    note: "Placed near the extreme-right pole despite Main Street Partnership membership and a pro-labor voting record.  Part of the H107 pattern."
  - icpsr: 29516   # WELLER, Gerald C. (Jerry) (R-IL)
    note: "Placed near the extreme-right pole despite a mainstream Ways and Means profile.  Part of the H107 pattern."

H115:
  - icpsr: 29768   # SMITH, Adam (D-WA)
    note: "GGUM places Smith at Squad-adjacent extremity (-2.14), which conflicts with his record as a centrist Armed Services ranking member.  The placement is reproducible under five-chain seeded-init refits."
  - icpsr: 21701   # BACON, Donald J. (R-NE)
    note: "Overstated at the right pole given Bacon's documented centrist, bipartisan reputation."
  - icpsr: 21191   # GRIFFITH, H. Morgan (R-VA)
    note: "Overstated at the right pole given a mainstream conservative reputation."

S106:
  - icpsr: 49904   # MILLER, Zell Bryan (D-GA)
    note: "GGUM places Zell Miller to the left of the Senate median, which conflicts sharply with his historical record as one of the most conservative Democrats to serve in the modern Senate (he keynoted the 2004 Republican National Convention and endorsed George W. Bush).  In other chambers in this release (notably S108) GGUM places him correctly on the conservative side.  The S106 estimate appears to be a chamber-specific artifact."

S111:
  - icpsr: 49309   # FEINGOLD, Russell D. (D-WI)
    note: "Russ Feingold's GGUM estimate here (-0.38) is substantially less extreme than in the chambers immediately before and after this one.  His historical record places him reliably among the most liberal members of the Senate.  The S111 estimate reverses that pattern without an obvious substantive justification, likely driven by his S111 (lame-duck 2010) record of NO votes on Patriot Act renewal and some financial reform cloture motions."

S115:
