# Chamber-specific "placements worth a second look" surfaced on each chamber's
# sub-page.  For every member listed here, GGUM's placement differs enough from
# what the member's established political reputation might lead a reader to
# expect that researchers may want to inspect the case before using the
# estimate for a particular analysis.  We are drawing attention, not alleging
# error --- some of these may turn out to be substantively correct once the
# chamber's roll-call dynamics are considered.
#
# Each entry: a short, strictly accurate description of (a) the member's
# commonly-held reputation and (b) where GGUM places them in this chamber.
#
# The regen pipeline also sets `ggum_flag = "review"` in the CSV row for each
# member listed here.

H102:
  - icpsr: 15059   # SIKORSKI, Gerald Edward (D-MN)
    note: "Sikorski is commonly viewed as a mainstream Minnesota liberal.  GGUM places him at the extreme-left pole, left of Bernie Sanders in this chamber."

H104:
  - icpsr: 29555   # COBURN, Thomas Allen (R-OK)
    note: "Coburn is commonly viewed as a reliably conservative Republican, nicknamed \"Dr. No\" for routinely opposing spending bills.  GGUM places him near the Republican median in this chamber, roughly the 110th-most-conservative of 235 Republicans."
