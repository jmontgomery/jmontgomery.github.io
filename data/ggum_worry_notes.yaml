    note: "Duncan is commonly viewed as a reliably conservative Republican.  GGUM places him near the center."
  - icpsr: 29565   # SANFORD, Mark (R-SC)
    note: "Sanford is commonly viewed as a strongly conservative Republican.  GGUM places him near the center."

H105:
